name: home_control
description: Controle HOME — envia comandos MQTT aos dispositivos ESP8266.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  mqtt_client: ^10.5.1
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.2
  web_socket_channel: ^2.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
