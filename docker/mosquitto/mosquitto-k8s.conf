# Mosquitto — producao K3s (automacao)
# 1883: MQTT TCP (somente rede interna do cluster)
# 9001: WebSocket (Traefik WSS em mqtt.omny.app.br)

listener 1883
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
