name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  backend:
    name: Backend (test + package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Permissão de execução do wrapper
        run: chmod +x mvnw

      - name: Rodar testes
        run: ./mvnw -B test

      - name: Empacotar (sem testes)
        run: ./mvnw -B -DskipTests package

  docker:
    name: Build da imagem do backend
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t home-backend:ci ./backend
