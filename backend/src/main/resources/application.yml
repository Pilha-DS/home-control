server:
  port: ${SERVER_PORT:8080}
  # Encerra aguardando requisicoes em andamento (ver spring.lifecycle abaixo).
  shutdown: graceful

spring:
  application:
    name: home-backend

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

  # --- Banco de dados (100% externalizavel) ---
  # Troque as credenciais a qualquer hora via variaveis de ambiente,
  # sem recompilar. DB_DRIVER controla o dialeto/plataforma do Flyway.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/home_control?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      pool-name: home-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONN_TIMEOUT_MS:30000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
      # Detecta conexoes mortas (ex.: MySQL reiniciado) antes de entregar.
      validation-timeout: 5000

  jpa:
    hibernate:
      # O schema e gerido pelo Flyway (migrations). Hibernate nao altera nada.
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Flyway descobre o dialeto pelo driver; forca MySQL por padrao.
    baseline-on-migrate: true

# --- Seguranca / JWT ---
app:
  # java = ESP fala HTTP direto com o backend (padrao)
  # mqtt = modo legado via broker Mosquitto
  transport: ${APP_TRANSPORT:java}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-at-least-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24h
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    # Se true, cria/atualiza o admin na inicializacao (recomendado na 1a subida)
    seed-on-startup: ${ADMIN_SEED_ON_STARTUP:true}
  cors:
    # Lista separada por virgula. "*" libera geral (dev); em prod restrinja ao
    # dominio do app (ex.: https://automacao.omny.app.br).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  security:
    # Em perfil prod, falha na subida se os segredos ainda forem os padroes.
    strict-secrets: ${APP_STRICT_SECRETS:false}
  login-rate-limit:
    # Protecao contra brute-force em POST /api/auth/login (por IP+usuario).
    max-attempts: ${LOGIN_MAX_ATTEMPTS:10}
    window-seconds: ${LOGIN_WINDOW_SECONDS:60}

# --- MQTT (conta de servico do backend) ---
# Mesmo transporte do ESP: wss://host:443/ (path preenchido → WebSocket).
mqtt:
  host: ${MQTT_HOST:mosquito.omny.tec.br}
  port: ${MQTT_PORT:443}
  username: ${MQTT_USER:cardoso}
  password: ${MQTT_PASS:C6m8n4d2d3}
  path: ${MQTT_PATH:/}
  use-ssl: ${MQTT_SSL:true}
  client-id-prefix: ${MQTT_CLIENT_ID_PREFIX:home_backend}
  # Topicos assinados (wildcards de telemetria). Separados por virgula.
  subscribe-topics: ${MQTT_SUBSCRIBE_TOPICS:home/+/+/state,home/+/+/ack,home/+/+/status,home/+/+/ip,home/+/+/config/ack,home/logs/+/+/basic,home/logs/+/+/advance}

logging:
  level:
    root: INFO
    com.home.backend: INFO
  # requestId e injetado pelo RequestIdFilter (correlaciona logs de uma requisicao).
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:7}

# --- Observabilidade (Actuator) ---
# /actuator/health      -> status real (inclui banco de dados)
# /actuator/health/liveness e /readiness -> probes para orquestradores
# /actuator/metrics e /actuator/prometheus -> metricas (exigem JWT)
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
  endpoint:
    health:
      # when_authorized: detalhes (banco, disco...) so com JWT; sem token, so o status.
      show-details: ${MANAGEMENT_HEALTH_DETAILS:when_authorized}
      probes:
        enabled: true
  health:
    defaults:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
    # Desligue em prod: SPRINGDOC_ENABLED=false
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: true
